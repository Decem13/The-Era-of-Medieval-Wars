<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Era of Medieval Wars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#8f1a1a;--redb:#d32f2f;--gold:#c9a227;--text:#e6e1d8}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:Georgia,'Times New Roman',serif;color:var(--text);background-color:#2b2b2b;
background-image:radial-gradient(circle at 18% 8%,rgba(255,255,255,.055),transparent 45%),
radial-gradient(circle at 82% 92%,rgba(0,0,0,.5),transparent 55%),
repeating-linear-gradient(45deg,rgba(255,255,255,.014) 0 2px,transparent 2px 7px),
repeating-linear-gradient(-45deg,rgba(0,0,0,.05) 0 3px,transparent 3px 9px);user-select:none}
.screen{position:fixed;inset:0;display:none}.screen.active{display:block}
#gameScreen.active{display:flex;flex-direction:column}
.btn{font-family:inherit;font-size:20px;letter-spacing:1px;text-transform:uppercase;color:var(--text);
padding:13px 30px;border:2px solid var(--red);border-radius:6px;cursor:pointer;
background:linear-gradient(180deg,#4b4b4b,#2c2c2c);
box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -2px 6px rgba(0,0,0,.45),0 5px 12px rgba(0,0,0,.55);
transition:transform .12s,background .18s,border-color .18s,box-shadow .18s}
.btn:hover{background:linear-gradient(180deg,#5e5e5e,#383838);border-color:var(--redb);transform:translateY(-2px);
box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 18px rgba(0,0,0,.6),0 0 16px rgba(211,47,47,.35)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 3px 10px rgba(0,0,0,.65)}
.btn:disabled{opacity:.5;cursor:default;transform:none!important}
.btn.big{font-size:27px;padding:20px 58px}.btn.small{font-size:15px;padding:9px 18px}
#mainMenu .title{position:absolute;top:34px;left:48px;margin:0;max-width:62%;
font-family:'Cinzel Decorative',Georgia,serif;font-weight:900;font-size:clamp(26px,4.6vw,62px);
line-height:1.08;letter-spacing:3px;color:#b3151a;
text-shadow:0 0 22px rgba(190,25,25,.55),0 0 60px rgba(160,15,15,.3),3px 3px 0 #140505,-1px -1px 0 rgba(255,120,120,.25)}
.bottom-left{position:absolute;left:48px;bottom:40px;display:flex;align-items:center;gap:22px}
.corner-br{position:absolute;right:40px;bottom:32px}
.corner-tl{position:absolute;left:32px;top:28px;z-index:5}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;
align-items:center;justify-content:center;gap:40px;flex-wrap:wrap;width:100%;padding:0 20px}
.bottom-center{position:absolute;left:50%;bottom:34px;transform:translateX(-50%)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:12px 22px;
background:linear-gradient(180deg,#3b3b3b,#232323);border-bottom:3px solid var(--red);
box-shadow:0 5px 18px rgba(0,0,0,.65);flex-shrink:0}
.topbar .item{font-size:16px;letter-spacing:.6px;white-space:nowrap}
.topbar .item b{color:var(--gold);font-weight:normal}
.topbar .sep{width:2px;height:22px;background:rgba(255,255,255,.12)}
.topbar .spacer{flex:1 1 16px}
.phase{color:var(--gold);text-transform:uppercase;font-size:13px!important;letter-spacing:1.4px!important;
padding:4px 12px;border:1px solid rgba(201,162,39,.45);border-radius:4px;
background:rgba(201,162,39,.07);white-space:nowrap}
.phase.battle{color:#ffb4a2;border-color:rgba(211,47,47,.6);background:rgba(211,47,47,.12)}
.ready-btn{font-size:18px;padding:11px 30px;border-color:var(--gold);
background:linear-gradient(180deg,#7d2323,#4a1212);color:#ffe9c9;animation:pulse 2s ease-in-out infinite}
.ready-btn:hover{border-color:#f0d06a;background:linear-gradient(180deg,#9a2b2b,#5c1616)}
.ready-btn:disabled{animation:none;opacity:.7}
@keyframes pulse{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 16px rgba(0,0,0,.55),0 0 8px rgba(201,162,39,.25)}
50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 16px rgba(0,0,0,.55),0 0 24px rgba(201,162,39,.7)}}
.prep-panel{display:flex;align-items:center;gap:12px;padding:9px 22px;
background:linear-gradient(180deg,#2e2e2e,#1e1e1e);border-bottom:2px solid #444;flex-shrink:0;
flex-wrap:wrap;min-height:48px}
.prep-group{display:flex;gap:6px;align-items:center}
.prep-label{color:#999;font-size:13px;letter-spacing:.5px;white-space:nowrap}
.prep-sep{width:1px;height:24px;background:#444}
.prep-btn{font-family:inherit;font-size:14px;padding:6px 14px;color:var(--text);
background:linear-gradient(180deg,#3a3a3a,#252525);border:1px solid #555;border-radius:4px;
cursor:pointer;transition:all .15s;min-width:36px;letter-spacing:.3px}
.prep-btn:hover:not(:disabled){border-color:var(--redb);background:linear-gradient(180deg,#4a4a4a,#333)}
.prep-btn.active{border-color:var(--gold);background:linear-gradient(180deg,#7d2323,#4a1212);
color:#ffe9c9;box-shadow:0 0 10px rgba(201,162,39,.4)}
.prep-btn.insufficient{background:linear-gradient(180deg,#5a1a1a,#2e0808)!important;
border-color:#7a1010!important;color:#a06060!important;opacity:.55;cursor:not-allowed!important}
.clear-btn{border-color:#666}.clear-btn:hover:not(:disabled){border-color:var(--redb)!important;color:#ffd0c0}
.prep-hint{color:#666;font-size:12px;font-style:italic;margin-left:auto;white-space:nowrap}
.board-wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
padding:16px;min-height:0;overflow:hidden}
#board{display:block;border-radius:5px;box-shadow:0 14px 40px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.85);cursor:pointer}
.round-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
background:rgba(0,0,0,.72);z-index:300;padding:20px}
.round-overlay.show{display:flex}
.round-result-card{background:linear-gradient(180deg,#3a3a3a,#262626);border:2px solid var(--gold);
border-radius:12px;padding:34px 44px;text-align:center;max-width:480px;
box-shadow:0 20px 60px rgba(0,0,0,.9),0 0 30px rgba(201,162,39,.2);animation:pop .2s}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.round-result-card h2{margin:0 0 14px;font-family:'Cinzel Decorative',Georgia,serif;font-size:26px;
color:var(--gold);text-shadow:0 2px 0 #000;letter-spacing:1px}
.round-result-card p{margin:0 0 24px;font-size:16px;color:#ccc;line-height:1.55}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
background:rgba(0,0,0,.72);backdrop-filter:blur(2px);z-index:500;padding:20px}
.modal.open{display:flex}
.modal-card{width:100%;max-width:430px;padding:30px 32px 26px;
background:linear-gradient(180deg,#3a3a3a,#262626);border:2px solid var(--red);border-radius:10px;
box-shadow:0 24px 60px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08);animation:pop .18s}
.modal-card h2{margin:0 0 22px;font-family:'Cinzel Decorative',Georgia,serif;font-size:24px;
font-weight:700;letter-spacing:1.5px;color:#d8cfc0;text-shadow:0 2px 0 #000}
.modal-card .row{display:flex;align-items:center;justify-content:space-between;gap:16px;
margin-bottom:14px;font-size:17px}
.modal-card .row .val{color:var(--gold);min-width:56px;text-align:right}
.modal-card .actions{margin-top:24px;display:flex;justify-content:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;
background:linear-gradient(90deg,var(--red) 0%,#555 0%);outline:none;cursor:pointer;
border:1px solid #1a1a1a;margin:8px 0 4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;
border-radius:50%;background:radial-gradient(circle at 35% 30%,#e0d8c8,#8b8272 70%,#4a443a);
border:2px solid var(--red);box-shadow:0 2px 6px rgba(0,0,0,.7);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;
background:radial-gradient(circle at 35% 30%,#e0d8c8,#8b8272 70%,#4a443a);border:2px solid var(--red);
box-shadow:0 2px 6px rgba(0,0,0,.7);cursor:pointer}
select{font-family:inherit;font-size:17px;color:var(--text);background:#232323;
border:2px solid var(--red);border-radius:6px;padding:8px 14px;cursor:pointer;outline:none}
select:hover{border-color:var(--redb)}
.toast{position:fixed;top:46px;left:50%;transform:translate(-50%,-22px);padding:14px 30px;font-size:18px;
letter-spacing:.6px;color:var(--text);background:rgba(20,20,20,.96);border:2px solid var(--red);
border-radius:8px;box-shadow:0 12px 34px rgba(0,0,0,.8);opacity:0;pointer-events:none;
transition:opacity .35s,transform .35s;z-index:1000;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.topbar{gap:8px 14px;padding:10px 14px}.topbar .item{font-size:14px}
.ready-btn{font-size:15px;padding:9px 18px}.prep-hint{display:none}}
@media(max-width:700px){#mainMenu .title{top:20px;left:20px;max-width:88%}
.bottom-left{left:20px;bottom:24px;gap:14px}.corner-br{right:20px;bottom:22px}
.btn.big{font-size:21px;padding:15px 34px}.center{gap:20px}.toast{font-size:15px;padding:12px 20px}
.prep-panel{gap:8px;padding:8px 12px}.prep-label{display:none}}
</style>
</head>
<body>

<div id="mainMenu" class="screen active">
  <h1 class="title">The Era<br>of Medieval Wars</h1>
  <div class="bottom-left">
    <button class="btn big" id="btnPlay">Игра</button>
    <button class="btn" id="btnExit">Выход</button>
  </div>
  <button class="btn corner-br" id="btnSettingsMain">Настройки</button>
</div>

<div id="modeMenu" class="screen">
  <button class="btn small corner-tl" id="btnBackFromMode">Назад</button>
  <div class="center"><button class="btn big" id="btnSingle">Одиночная игра</button></div>
</div>

<div id="sideMenu" class="screen">
  <button class="btn small corner-tl" id="btnBackFromSide">Назад</button>
  <div class="center">
    <button class="btn big" data-side="attack">Атакующие</button>
    <button class="btn big" data-side="defend">Обороняющие</button>
  </div>
  <button class="btn bottom-center" id="btnMatchSettings">Настройки</button>
</div>

<div id="gameScreen" class="screen">
  <div class="topbar">
    <span class="item">Вы играете за: <b id="sideLabel">—</b></span>
    <span class="sep"></span>
    <span class="item" id="roundLabel">Раунд 1 / 5</span>
    <span class="sep"></span>
    <span class="item">Ресурсы: <b id="resLabel">120</b> юнитов, <b id="resHorses">40</b> коней</span>
    <span class="spacer"></span>
    <span class="phase" id="phaseLabel">Фаза подготовки</span>
    <button class="btn ready-btn" id="btnReady">Готов</button>
    <button class="btn small" id="btnToMain">В главное меню</button>
  </div>
  <div class="prep-panel" id="prepPanel">
    <span class="prep-label">Тип:</span>
    <div class="prep-group">
      <button class="prep-btn" data-type="inf">Пехота</button>
      <button class="prep-btn" data-type="cav">Кавалерия</button>
    </div>
    <div class="prep-sep"></div>
    <span class="prep-label">Отряд:</span>
    <div class="prep-group">
      <button class="prep-btn" data-size="5">5</button>
      <button class="prep-btn" data-size="10">10</button>
      <button class="prep-btn" data-size="20">20</button>
      <button class="prep-btn" data-size="40">40</button>
    </div>
    <div class="prep-sep"></div>
    <button class="prep-btn clear-btn" id="btnClear">Очистить поле</button>
    <span class="prep-hint">ЛКМ — поставить · ПКМ — убрать</span>
  </div>
  <div class="board-wrap" id="boardWrap">
    <canvas id="board"></canvas>
    <div class="round-overlay" id="roundOverlay">
      <div class="round-result-card">
        <h2 id="roundResultTitle">Результат раунда</h2>
        <p id="roundResultText"></p>
        <button class="btn" id="btnNextRound">Следующий раунд</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-card">
    <h2>Настройки</h2>
    <div class="row"><span>Громкость звука</span><span class="val" id="volumeValue">50%</span></div>
    <input type="range" id="volumeSlider" min="0" max="100" step="1" value="50">
    <div class="actions"><button class="btn" id="btnCloseSettings">Выйти из настроек</button></div>
  </div>
</div>

<div class="modal" id="matchModal">
  <div class="modal-card">
    <h2>Настройки матча</h2>
    <div class="row">
      <span>Количество раундов</span>
      <select id="roundsSelect">
        <option value="3">3</option>
        <option value="5" selected>5</option>
        <option value="7">7</option>
        <option value="9">9</option>
      </select>
    </div>
    <div class="actions"><button class="btn" id="btnCloseMatch">Выйти</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ STATE ============ */
const state = {
  volume:50, rounds:5, side:null, round:1, phase:"prepare",
  units:120, horses:40, enemyUnits:120, enemyHorses:40,
  troops:[], selectedType:"inf", selectedSize:5, breakthrough:false
};
const SIDE_NAMES = {attack:"Атакующих", defend:"Обороняющих"};
const ROUNDS_OK = [3,5,7,9];

/* ============ MAP ============ */
const COLS=26, ROWS=10, CELL=36;
const LW = COLS*CELL, LH = ROWS*CELL;
const NEUTRAL=10, DEF_START=16;
let nextId = 1;

function zoneBounds(side){
  return side==="attack" ? [0, NEUTRAL] : [DEF_START, COLS];
}

/* ============ UTILS ============ */
function $(id){ return document.getElementById(id); }

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id===id));
  if (id === "gameScreen"){
    requestAnimationFrame(() => { resizeCanvas(); drawBoard(); });
  }
}

function openModal(id){ $(id).classList.add("open"); }
function closeModal(id){ $(id).classList.remove("open"); }

let toastTimer = null;
function showToast(msg, dur){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), dur || 2000);
}

/* ============ MAIN MENU ============ */
$("btnPlay").onclick = () => showScreen("modeMenu");
$("btnExit").onclick = () => { showToast("Спасибо за игру"); setTimeout(() => window.close(), 900); };
$("btnSettingsMain").onclick = () => openModal("settingsModal");

/* ============ MODE MENU ============ */
$("btnSingle").onclick = () => showScreen("sideMenu");
$("btnBackFromMode").onclick = () => showScreen("mainMenu");

/* ============ SIDE MENU ============ */
document.querySelectorAll("#sideMenu [data-side]").forEach(btn => {
  btn.onclick = () => startGame(btn.dataset.side);
});
$("btnBackFromSide").onclick = () => showScreen("modeMenu");
$("btnMatchSettings").onclick = () => {
  $("roundsSelect").value = String(state.rounds);
  openModal("matchModal");
};
$("btnCloseMatch").onclick = () => closeModal("matchModal");
$("roundsSelect").onchange = e => {
  const v = parseInt(e.target.value, 10);
  if (ROUNDS_OK.indexOf(v) !== -1) state.rounds = v;
};

/* ============ VOLUME ============ */
const volumeSlider = $("volumeSlider");
const volumeValue = $("volumeValue");

function updateVolumeFill(){
  const p = state.volume;
  volumeSlider.style.background = `linear-gradient(90deg,var(--red) 0%,var(--red) ${p}%,#555 ${p}%,#555 100%)`;
}
function applyVolume(v){
  state.volume = Math.max(0, Math.min(100, v));
  volumeValue.textContent = state.volume + "%";
  volumeSlider.value = String(state.volume);
  updateVolumeFill();
}
volumeSlider.oninput = e => applyVolume(parseInt(e.target.value, 10));
$("btnCloseSettings").onclick = () => closeModal("settingsModal");

document.querySelectorAll(".modal").forEach(m => {
  m.onclick = e => { if (e.target === m) m.classList.remove("open"); };
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.querySelectorAll(".modal.open").forEach(m => m.classList.remove("open"));
});

/* ============ START GAME ============ */
function startGame(side){
  state.side = side;
  state.round = 1;
  state.units = 120;
  state.horses = 40;
  state.enemyUnits = 120;
  state.enemyHorses = 40;
  state.selectedType = "inf";
  state.selectedSize = 5;
  state.troops = [];
  state.breakthrough = false;
  showScreen("gameScreen");
  beginRound();
}

/* ============ ROUND ============ */
function beginRound(){
  if (battleAnim){ cancelAnimationFrame(battleAnim); battleAnim = null; }
  state.phase = "prepare";
  state.troops = [];
  state.breakthrough = false;
  nextId = 1;

  generateEnemyArmy();
  clampSelectedSize();

  $("roundOverlay").classList.remove("show");
  updateHUD();
  updatePrepPanel();
  requestAnimationFrame(() => { resizeCanvas(); drawBoard(); });
}

/* ============ ENEMY ARMY ============ */
function generateEnemyArmy(){
  if (!state.side) return;
  const enemySide = state.side === "attack" ? "defend" : "attack";
  const b = zoneBounds(enemySide);
  const zStart = b[0], zEnd = b[1];
  const used = new Set();

  function pickCell(){
    for (let i=0; i<400; i++){
      const col = zStart + Math.floor(Math.random()*(zEnd-zStart));
      const row = Math.floor(Math.random()*ROWS);
      const key = col+":"+row;
      if (!used.has(key)){ used.add(key); return {col, row}; }
    }
    return null;
  }

  let units = state.enemyUnits;
  let horses = state.enemyHorses;

  function addSquad(type, size){
    const cell = pickCell();
    if (!cell) return false;
    state.troops.push({
      id: nextId++, side: enemySide, type, count:size, maxCount:size,
      col: cell.col, row: cell.row, x: cell.col + 0.5,
      alive: true, charged: false, cooldown: 0, inCombat: false
    });
    return true;
  }

  // Cavalry: up to 3 squads of 10
  for (let i=0; i<3; i++){
    if (horses >= 10 && units >= 10){
      if (addSquad("cav", 10)){ horses -= 10; units -= 10; }
    }
  }
  // Infantry
  const plan = [20,20,20,10,10,5,5,5];
  for (const s of plan){
    if (units >= s && addSquad("inf", s)) units -= s;
  }
  while (units >= 5){
    const s = Math.min(10, units);
    if (!addSquad("inf", s)) break;
    units -= s;
  }

  state.enemyUnits = units;
  state.enemyHorses = horses;
}

/* ============ HUD ============ */
function updateHUD(){
  $("sideLabel").textContent = state.side ? SIDE_NAMES[state.side] : "—";
  $("roundLabel").textContent = `Раунд ${state.round} / ${state.rounds}`;
  $("resLabel").textContent = String(state.units);
  $("resHorses").textContent = String(state.horses);

  const btn = $("btnReady");
  const ph = $("phaseLabel");

  if (state.phase === "prepare"){
    btn.textContent = "Готов";
    btn.disabled = false;
    btn.style.display = "";
    ph.textContent = "Фаза подготовки";
    ph.classList.remove("battle");
  } else if (state.phase === "battle"){
    btn.textContent = "Бой идёт...";
    btn.disabled = true;
    btn.style.display = "";
    ph.textContent = "Бой идёт!";
    ph.classList.add("battle");
  } else {
    btn.style.display = "none";
    ph.textContent = "Раунд завершён";
    ph.classList.add("battle");
  }
}

/* ============ PREP PANEL ============ */
function clampSelectedSize(){
  const sizes = [5,10,20,40];
  const need = s => state.units >= s && (state.selectedType !== "cav" || state.horses >= s);
  const valid = sizes.filter(need);
  if (valid.length && valid.indexOf(state.selectedSize) === -1){
    state.selectedSize = valid[valid.length-1];
  }
}

function updatePrepPanel(){
  const panel = $("prepPanel");
  if (state.phase !== "prepare"){
    panel.style.display = "none";
    return;
  }
  panel.style.display = "";

  document.querySelectorAll("[data-type]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.type === state.selectedType);
  });

  const sizes = [5,10,20,40];
  const validSizes = [];
  document.querySelectorAll("[data-size]").forEach(btn => {
    const size = parseInt(btn.dataset.size, 10);
    const insuf = state.units < size || (state.selectedType === "cav" && state.horses < size);
    btn.classList.toggle("insufficient", insuf);
    btn.disabled = insuf;
    btn.classList.toggle("active", size === state.selectedSize && !insuf);
    if (!insuf) validSizes.push(size);
  });

  // auto-fallback if selected size not valid
  if (validSizes.length && validSizes.indexOf(state.selectedSize) === -1){
    state.selectedSize = validSizes[validSizes.length-1];
    document.querySelectorAll("[data-size]").forEach(btn => {
      const size = parseInt(btn.dataset.size, 10);
      btn.classList.toggle("active", size === state.selectedSize && !btn.disabled);
    });
  }
}

/* type / size handlers */
document.querySelectorAll("[data-type]").forEach(btn => {
  btn.onclick = () => {
    state.selectedType = btn.dataset.type;
    clampSelectedSize();
    updatePrepPanel();
  };
});
document.querySelectorAll("[data-size]").forEach(btn => {
  btn.onclick = () => {
    if (btn.disabled) return;
    state.selectedSize = parseInt(btn.dataset.size, 10);
    updatePrepPanel();
  };
});

$("btnClear").onclick = () => {
  if (state.phase !== "prepare") return;
  state.troops = state.troops.filter(t => {
    if (t.side === state.side && t.alive){
      state.units += t.count;
      if (t.type === "cav") state.horses += t.count;
      return false;
    }
    return true;
  });
  updateHUD();
  updatePrepPanel();
  drawBoard();
};

/* ============ CANVAS RESIZE ============ */
function resizeCanvas(){
  const canvas = $("board");
  if (!canvas) return;
  const wrap = $("boardWrap");
  const dpr = window.devicePixelRatio || 1;
  const availW = Math.max(300, wrap.clientWidth - 32);
  const availH = Math.max(150, wrap.clientHeight - 32);
  const scale = Math.min(availW / LW, availH / LH);

  const cssW = LW * scale;
  const cssH = LH * scale;
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas._scale = scale;
  canvas._dpr = dpr;
}

/* ============ DRAW ============ */
function drawBoard(){
  const canvas = $("board");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const dpr = canvas._dpr || 1;
  const scale = canvas._scale || 1;

  ctx.setTransform(scale*dpr, 0, 0, scale*dpr, 0, 0);
  ctx.clearRect(0, 0, LW, LH);

  // zones
  for (let r=0; r<ROWS; r++){
    for (let c=0; c<COLS; c++){
      const light = (r+c)%2 === 0;
      let color;
      if (c < NEUTRAL) color = light ? "#3d2b26" : "#35241f";
      else if (c < DEF_START) color = light ? "#2f3d27" : "#28331f";
      else color = light ? "#2b3138" : "#242a30";
      ctx.fillStyle = color;
      ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
      ctx.fillStyle = "rgba(255,255,255,0.022)";
      ctx.fillRect(c*CELL, r*CELL, CELL, 5);
    }
  }

  // grid
  ctx.strokeStyle = "rgba(0,0,0,.45)";
  ctx.lineWidth = 1;
  for (let c=0; c<=COLS; c++){
    ctx.beginPath(); ctx.moveTo(c*CELL+0.5, 0); ctx.lineTo(c*CELL+0.5, LH); ctx.stroke();
  }
  for (let r=0; r<=ROWS; r++){
    ctx.beginPath(); ctx.moveTo(0, r*CELL+0.5); ctx.lineTo(LW, r*CELL+0.5); ctx.stroke();
  }

  // zone dividers
  ctx.save();
  ctx.setLineDash([7,6]); ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(201,162,39,.55)";
  [NEUTRAL, DEF_START].forEach(c => {
    ctx.beginPath(); ctx.moveTo(c*CELL, 0); ctx.lineTo(c*CELL, LH); ctx.stroke();
  });
  ctx.restore();

  // troops
  state.troops.forEach(t => {
    if (t.alive) drawTroop(ctx, t);
  });

  // fog
  if (state.phase === "prepare" && state.side){
    const enemySide = state.side === "attack" ? "defend" : "attack";
    const b = zoneBounds(enemySide);
    const fx = b[0]*CELL, fw = (b[1]-b[0])*CELL;
    ctx.fillStyle = "#000";
    ctx.fillRect(fx, 0, fw, LH);
    ctx.save();
    ctx.setLineDash([9,7]); ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(255,255,255,.13)";
    ctx.strokeRect(fx+7, 7, fw-14, LH-14);
    ctx.restore();
    ctx.font = "700 " + Math.round(CELL*0.42) + "px Georgia,serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#888";
    ctx.fillText("Вражеская", fx+fw/2, LH/2 - CELL*0.55);
    ctx.fillText("территория", fx+fw/2, LH/2);
    ctx.fillText("скрыта", fx+fw/2, LH/2 + CELL*0.55);
  }

  // outer border
  ctx.strokeStyle = "#8f1a1a"; ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, LW-4, LH-4);
  ctx.strokeStyle = "rgba(201,162,39,.35)"; ctx.lineWidth = 1;
  ctx.strokeRect(6.5, 6.5, LW-13, LH-13);
}

function drawTroop(ctx, t){
  const cx = t.x * CELL;
  const cy = (t.row + 0.5) * CELL;
  const r = CELL * 0.4;

  // shadow
  ctx.beginPath(); ctx.arc(cx, cy+2, r, 0, Math.PI*2);
  ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fill();

  // body
  const grad = ctx.createRadialGradient(cx-r*0.3, cy-r*0.4, r*0.1, cx, cy, r);
  if (t.side === "attack"){ grad.addColorStop(0,"#e0574f"); grad.addColorStop(1,"#7d1410"); }
  else { grad.addColorStop(0,"#6f9fd8"); grad.addColorStop(1,"#1d3c66"); }
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = grad; ctx.fill();
  ctx.lineWidth = 1.6;
  ctx.strokeStyle = t.side === "attack" ? "#f0b090" : "#bcd6f5";
  ctx.stroke();

  // icon
  ctx.strokeStyle = "rgba(255,255,255,.9)";
  ctx.lineWidth = 1.6; ctx.lineCap = "round";
  const iy = cy - r*0.25;
  if (t.type === "inf"){
    ctx.beginPath(); ctx.moveTo(cx, iy - r*0.35); ctx.lineTo(cx, iy + r*0.35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - r*0.22, iy + r*0.05); ctx.lineTo(cx + r*0.22, iy + r*0.05); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(cx - r*0.35, iy + r*0.3); ctx.lineTo(cx + r*0.35, iy - r*0.35); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx - r*0.22, iy + r*0.18, r*0.13, 0, Math.PI*2); ctx.stroke();
  }

  // count badge
  const badgeW = r * 1.05;
  const badgeH = r * 0.52;
  const badgeY = cy + r * 0.48;
  ctx.fillStyle = "rgba(0,0,0,.75)";
  ctx.beginPath();
  const bx = cx - badgeW/2, by = badgeY - badgeH/2;
  const rad = badgeH/2;
  ctx.moveTo(bx + rad, by);
  ctx.lineTo(bx + badgeW - rad, by);
  ctx.quadraticCurveTo(bx + badgeW, by, bx + badgeW, by + rad);
  ctx.lineTo(bx + badgeW, by + badgeH - rad);
  ctx.quadraticCurveTo(bx + badgeW, by + badgeH, bx + badgeW - rad, by + badgeH);
  ctx.lineTo(bx + rad, by + badgeH);
  ctx.quadraticCurveTo(bx, by + badgeH, bx, by + badgeH - rad);
  ctx.lineTo(bx, by + rad);
  ctx.quadraticCurveTo(bx, by, bx + rad, by);
  ctx.closePath();
  ctx.fill();
  ctx.font = "bold " + Math.round(CELL*0.26) + "px Georgia,serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff";
  ctx.fillText(t.count, cx, badgeY + 0.5);
}

/* ============ PLACEMENT ============ */
function screenToCell(clientX, clientY){
  const canvas = $("board");
  const rect = canvas.getBoundingClientRect();
  const lx = (clientX - rect.left) / rect.width * LW;
  const ly = (clientY - rect.top) / rect.height * LH;
  return { col: Math.floor(lx/CELL), row: Math.floor(ly/CELL) };
}

$("board").addEventListener("click", e => {
  if (state.phase !== "prepare" || !state.side) return;
  const cell = screenToCell(e.clientX, e.clientY);
  if (cell.col < 0 || cell.col >= COLS || cell.row < 0 || cell.row >= ROWS) return;

  const b = zoneBounds(state.side);
  if (cell.col < b[0] || cell.col >= b[1]) return;

  const occupied = state.troops.some(t => t.alive && t.col === cell.col && t.row === cell.row);
  if (occupied) return;

  const size = state.selectedSize;
  const type = state.selectedType;
  if (state.units < size){ showToast("Недостаточно юнитов"); return; }
  if (type === "cav" && state.horses < size){ showToast("Недостаточно коней"); return; }

  state.units -= size;
  if (type === "cav") state.horses -= size;

  state.troops.push({
    id: nextId++, side: state.side, type, count:size, maxCount:size,
    col: cell.col, row: cell.row, x: cell.col + 0.5,
    alive: true, charged: false, cooldown: 0, inCombat: false
  });

  updateHUD();
  updatePrepPanel();
  drawBoard();
});

$("board").addEventListener("contextmenu", e => {
  e.preventDefault();
  if (state.phase !== "prepare" || !state.side) return;
  const cell = screenToCell(e.clientX, e.clientY);

  const idx = state.troops.findIndex(t =>
    t.alive && t.side === state.side && t.col === cell.col && t.row === cell.row
  );
  if (idx === -1) return;

  const t = state.troops[idx];
  state.units += t.count;
  if (t.type === "cav") state.horses += t.count;
  state.troops.splice(idx, 1);

  updateHUD();
  updatePrepPanel();
  drawBoard();
});

/* ============ BATTLE ============ */
let battleAnim = null;
let lastBattleTime = 0;

function startBattle(){
  state.phase = "battle";
  state.troops.forEach(t => { t.charged = false; t.cooldown = 0; t.inCombat = false; });
  updateHUD();
  updatePrepPanel();
  drawBoard();
  lastBattleTime = performance.now();
  battleAnim = requestAnimationFrame(battleTick);
}

function battleTick(now){
  const dt = Math.min(0.1, (now - lastBattleTime) / 1000);
  lastBattleTime = now;

  updateBattle(dt);
  drawBoard();

  if (state.phase === "battle"){
    battleAnim = requestAnimationFrame(battleTick);
  }
}

const RANGE = 1.4;

function updateBattle(dt){
  // 1. find targets / move
  state.troops.forEach(t => {
    if (!t.alive) return;
    let nearest = null, nd = Infinity;
    state.troops.forEach(e => {
      if (!e.alive || e.side === t.side) return;
      const dx = e.x - t.x;
      const dy = e.row - t.row;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < RANGE && d < nd){ nearest = e; nd = d; }
    });
    t.inCombat = !!nearest;

    if (t.side === "attack" && !nearest){
      t.x += 2.0 * dt;
      if (t.x >= COLS - 0.5){
        t.x = COLS - 0.5;
        state.breakthrough = true;
      }
    }
  });

  // 2. combat ticks
  state.troops.forEach(t => {
    if (!t.alive || !t.inCombat){ t.cooldown = 0; return; }
    t.cooldown -= dt;
    if (t.cooldown > 0) return;
    t.cooldown += 0.5;

    let target = null, nd = Infinity;
    state.troops.forEach(e => {
      if (!e.alive || e.side === t.side) return;
      const dx = e.x - t.x;
      const dy = e.row - t.row;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < RANGE && d < nd){ target = e; nd = d; }
    });
    if (!target) return;

    let dmg = Math.max(1, Math.ceil(t.count * 0.2));
    if (t.type === "cav" && !t.charged){
      dmg *= 2;
      t.charged = true;
    }
    target.count -= dmg;
    if (target.count <= 0){ target.count = 0; target.alive = false; }
  });

  // 3. end check
  const atk = state.troops.some(t => t.alive && t.side === "attack");
  const def = state.troops.some(t => t.alive && t.side === "defend");
  if (state.breakthrough || !atk || !def) endBattle();
}

function endBattle(){
  if (battleAnim){ cancelAnimationFrame(battleAnim); battleAnim = null; }
  state.phase = "result";

  // survivors return to budget
  state.troops.forEach(t => {
    if (!t.alive) return;
    if (t.side === state.side){
      state.units += t.count;
      if (t.type === "cav") state.horses += t.count;
    } else {
      state.enemyUnits += t.count;
      if (t.type === "cav") state.enemyHorses += t.count;
    }
  });

  const atk = state.troops.some(t => t.alive && t.side === "attack");
  const def = state.troops.some(t => t.alive && t.side === "defend");

  let title, text;
  if (state.breakthrough){
    title = "Прорыв!";
    text = "Атакующие прорвались через позиции обороняющихся!";
  } else if (!def && atk){
    title = "Победа атакующих!";
    text = "Оборона смятена, защитники уничтожены.";
  } else if (!atk && def){
    title = "Победа обороняющихся!";
    text = "Атака отбита, нападающие уничтожены.";
  } else {
    title = "Раунд завершён";
    text = "Все отряды уничтожены.";
  }

  $("roundResultTitle").textContent = title;
  $("roundResultText").textContent = text + " Выжившие войска вернулись в резерв.";
  $("roundOverlay").classList.add("show");

  updateHUD();
  updatePrepPanel();
  drawBoard();
}

function nextRound(){
  if (state.round >= state.rounds){
    showToast("Матч завершён! Возврат в главное меню.", 2200);
    setTimeout(() => {
      state.side = null;
      state.round = 1;
      state.phase = "prepare";
      state.troops = [];
      showScreen("mainMenu");
    }, 1800);
    return;
  }
  state.round++;
  $("roundOverlay").classList.remove("show");
  beginRound();
}

/* ============ BUTTONS ============ */
$("btnReady").onclick = () => {
  if (state.phase === "prepare"){
    const playerTroops = state.troops.filter(t => t.side === state.side && t.alive);
    if (playerTroops.length === 0){
      showToast("Сначала расставьте войска!");
      return;
    }
    startBattle();
  }
};

$("btnNextRound").onclick = () => nextRound();

$("btnToMain").onclick = () => {
  if (battleAnim){ cancelAnimationFrame(battleAnim); battleAnim = null; }
  state.side = null;
  state.round = 1;
  state.phase = "prepare";
  state.troops = [];
  showScreen("mainMenu");
};

/* ============ RESIZE ============ */
let resizeT = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if ($("gameScreen").classList.contains("active")){
      resizeCanvas();
      drawBoard();
    }
  }, 90);
});

/* ============ INIT ============ */
(function init(){
  let saved = 50;
  try {
    const s = localStorage.getItem("temw_volume");
    if (s !== null){ saved = parseInt(s, 10) || 50; }
  } catch(e){}
  applyVolume(saved);
  volumeSlider.oninput = e => {
    applyVolume(parseInt(e.target.value, 10));
    try { localStorage.setItem("temw_volume", String(state.volume)); } catch(e){}
  };
  updateHUD();
  updatePrepPanel();
})();
</script>
